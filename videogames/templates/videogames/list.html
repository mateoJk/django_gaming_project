<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videogames List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            background-color: #f5f5f5;
            color: #333;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        th {
            background-color: #2c6fad;
            color: white;
            padding: 12px 16px;
            text-align: left;
        }
        td {
            padding: 10px 16px;
            border-bottom: 1px solid #ddd;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover td {
            background-color: #f0f7ff;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #2c6fad;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .empty {
            text-align: center;
            padding: 40px;
            color: #888;
        }
    </style>
</head>
<body>
    <h1>Videogames Catalog</h1>

    {% if videogames %}
    <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>Genre</th>
                <th>Platform</th>
                <th>Year</th>
                <th>Description</th>
            </tr>
        </thead>
        <tbody>
            {% for game in videogames %}
            <tr>
                <td><strong>{{ game.title }}</strong></td>
                <td>{{ game.genre }}</td>
                <td>{{ game.platform }}</td>
                <td>{{ game.release_year }}</td>
                <td>{{ game.description }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p class="empty">No videogames found in the catalog.</p>
    {% endif %}

    <br>
    <a href="/" class="back-link">&larr; Back to Home</a>
</body>
</html>
