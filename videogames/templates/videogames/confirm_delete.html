{% extends 'base.html' %}

{% block title %}Confirm Delete{% endblock %}

{% block content %}
    <h1>Are you sure you want to delete this game?</h1>

    <div style="background: white; padding: 30px; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto;">
        <p>You are about to permanently delete the game: <strong>{{ game.title }}</strong> from the catalog.</p>
        <p style="color: #d9534f; font-weight: bold;">This action cannot be undone.</p>

        <form method="post" style="margin-top: 20px;">
            {% csrf_token %}
            <a href="{% url 'videogame_list' %}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-danger">Yes, Delete Anyway</button>
        </form>
    </div>
{% endblock %}
