{% extends 'base.html' %}

{% block title %}Confirm Delete{% endblock %}

{% block content %}
    <h1 class="text-2xl font-bold text-center text-gray-900 mb-6 font-serif">Are you sure you want to delete this game?</h1>

    <div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-md border border-gray-200">
        <p class="text-sm text-gray-700 mb-2">You are about to permanently delete the game: <strong class="text-gray-900">{{ game.title }}</strong> from the catalog.</p>
        <p class="text-sm text-red-600 font-bold mb-6">This action cannot be undone.</p>

        <form method="post" class="flex items-center justify-end space-x-3 pt-4 border-t border-gray-100 mt-6">
            {% csrf_token %}
            <a href="{% url 'videogame_list' %}" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-2 px-4 rounded-md transition text-sm">
                Cancel
            </a>
            <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-medium py-2 px-4 rounded-md transition text-sm shadow-sm cursor-pointer">
                Yes, Delete Anyway
            </button>
        </form>
    </div>
{% endblock %}
