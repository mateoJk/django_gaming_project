<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Mi Gran Proyecto{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            background-color: #f5f5f5;
            color: #333;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        th {
            background-color: #2c6fad;
            color: white;
            padding: 12px 16px;
            text-align: left;
        }
        td {
            padding: 10px 16px;
            border-bottom: 1px solid #ddd;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover td {
            background-color: #f0f7ff;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #2c6fad;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .empty {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        body { font-family: Arial; max-width: 900px; margin: 40px auto; }
        .back-link { color: #2c6fad; }
    </style>
</head>
<body>
<nav style="margin-bottom: 20px;">
        <a href="{% url 'home' %}">Inicio</a> | 
        <a href="{% url 'videogame_list' %}">Catálogo</a>
    </nav>

    <main>
        {% block content %}

        {% endblock %}
    </main>
</body>
</html>
