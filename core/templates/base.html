<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gaming Project{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-900 flex flex-col min-h-screen">

    <nav class="bg-slate-900 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex space-x-4">
                    <a href="{% url 'videogame_list' %}" class="flex items-center py-2 px-3 font-bold text-xl tracking-wider text-blue-400">
                        🎮 GAMING DB
                    </a>
                </div>
                
                <div class="flex items-center space-x-4">
                    {% if user.is_authenticated %}
                        <span class="text-gray-300 text-sm">Hola, <strong class="text-white">{{ user.username }}</strong></span>
                        <a href="{% url 'home' %}" class="py-2 px-3 hover:text-blue-400 transition">Inicio</a>
                        <a href="{% url 'videogame_list' %}" class="py-2 px-3 hover:text-blue-400 transition">Catálogo</a>
                        
                        <form action="{% url 'logout' %}" method="post" class="inline">
                            {% csrf_token %}
                            <button type="submit" class="bg-red-600 hover:bg-red-700 text-white text-sm py-2 px-4 rounded-md font-medium transition cursor-pointer">
                                Cerrar Sesión
                            </button>
                        </form>
                    {% else %}
                        <a href="{% url 'home' %}" class="py-2 px-3 hover:text-blue-400 transition">Inicio</a>
                        <a href="{% url 'login' %}" class="py-2 px-3 hover:text-blue-400 transition">Iniciar Sesión</a>
                        <a href="{% url 'register' %}" class="bg-blue-600 hover:bg-blue-700 text-white text-sm py-2 px-4 rounded-md font-medium transition">
                            Registrarse
                        </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-6xl w-full mx-auto p-6">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-slate-900 text-gray-400 text-center py-4 text-sm mt-auto border-t border-slate-800">
        <p>Desarrollado por: <strong>Mateo Johnston</strong></p>
        <p class="text-xs text-gray-500 mt-1">Ingeniería de Software - Práctico 3 (Django & Tailwind)</p>
    </footer>

</body>
</html>
